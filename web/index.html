<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>App Atlas · 业务地图</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>App Atlas · 业务地图</h1>
    <button id="help-btn" class="help-btn" title="使用说明">?</button>
    <div class="global-search">
      <input id="global-search-input" type="search" placeholder="全局搜索业务描述…" autocomplete="off" />
      <div id="global-search-panel" class="gs-panel" hidden></div>
    </div>
  </header>
  <main class="layout">
    <aside id="sidebar">
      <div class="nav-toolbar">
        <input id="nav-search" type="search" placeholder="搜索模块 / 屏幕…" autocomplete="off" />
        <button id="nav-collapse" type="button" title="收起 / 展开全部">收起全部</button>
      </div>
      <div id="nav-tree-host">加载中…</div>
    </aside>
    <section id="stage"><p class="hint">从左侧选择一个屏幕</p></section>
    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" title="拖动调整业务逻辑面板宽度"></div>
    <section id="logic"><p class="hint">业务逻辑面板</p></section>
  </main>
  <script src="./vendor/marked.min.js"></script>
  <script src="./vendor/mermaid.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
